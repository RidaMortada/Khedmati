name: Flat feed action validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply flat social action patch
        run: python .github/scripts/flatten_feed_actions.py
      - name: Validate Android project
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace
      - name: Commit flat social actions
        run: |
          if git diff --quiet -- app/src/main/java/com/example/khedmati/MainActivity.kt; then
            echo "No app changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/khedmati/MainActivity.kt
          git commit -m "Use flat Facebook-style feed actions"
          git push origin HEAD:main
