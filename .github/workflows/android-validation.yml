name: Android validation

on:
  push:
    branches:
      - chatgpt/khadamati-gui-prototype

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Validate unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace
